<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S. — 3D core preview</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #010409; overflow: hidden; color: #cfefff; font-family: Rajdhani, sans-serif; }
  canvas { display: block; }
  .ui { position: fixed; left: 0; right: 0; bottom: 22px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  button { font: 500 11px Orbitron, sans-serif; letter-spacing: .2em; color: #00e5ff; background: rgba(0,229,255,.05);
    border: 1px solid rgba(0,229,255,.3); padding: 11px 15px; cursor: pointer; backdrop-filter: blur(4px); }
  button:hover, button.on { background: rgba(0,229,255,.18); color: #fff; box-shadow: 0 0 16px rgba(0,229,255,.35); }
  .title { position: fixed; top: 22px; left: 0; right: 0; text-align: center; font: 700 18px Orbitron, sans-serif;
    letter-spacing: .6em; color: #00e5ff; text-shadow: 0 0 18px #00e5ff; pointer-events: none; }
  .sub { position: fixed; top: 52px; left: 0; right: 0; text-align: center; font: 500 10px Orbitron, sans-serif;
    letter-spacing: .5em; color: rgba(0,229,255,.55); pointer-events: none; }
  .state { position: fixed; top: 50%; left: 0; right: 0; transform: translateY(calc(min(34vh, 300px))); text-align: center;
    font: 500 12px Orbitron, sans-serif; letter-spacing: .5em; color: #00e5ff; text-shadow: 0 0 10px currentColor; pointer-events: none; }
  .hint { position: fixed; bottom: 74px; left: 0; right: 0; text-align: center; color: #5f8ea3; font-size: 14px; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="title">J.A.R.V.I.S.</div>
<div class="sub">3D CORE · PREVIEW</div>
<div class="state" id="state">STANDING BY</div>
<div class="hint">Talk and watch it react to your mic · drag to orbit · buttons preview each state</div>
<div class="ui">
  <button data-s="idle" class="on">IDLE</button>
  <button data-s="listening">LISTENING</button>
  <button data-s="thinking">THINKING</button>
  <button data-s="speaking">SPEAKING</button>
  <button data-s="permission">PERMISSION</button>
  <button id="demo">▶ VOICE DEMO</button>
</div>

<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

// ---------------- renderer / scene ----------------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x010409, 0.035);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 0.6, 8.2);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.8, 0.45, 0.18);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const STATES = {
  idle:       { c: new THREE.Color(0x00c8ff), label: "STANDING BY" },
  listening:  { c: new THREE.Color(0xff5a2a), label: "LISTENING" },
  thinking:   { c: new THREE.Color(0x6f7dff), label: "PROCESSING" },
  speaking:   { c: new THREE.Color(0x00f0ff), label: "SPEAKING" },
  permission: { c: new THREE.Color(0xffb300), label: "AWAITING PERMISSION" },
};
let stateName = "idle";
const color = STATES.idle.c.clone();

// ---------------- shared GLSL noise ----------------
const NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;} vec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 permute(vec4 x){return mod289(((x*34.)+1.)*x);} vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-.85373472095314*r;}
float snoise(vec3 v){const vec2 C=vec2(1./6.,1./3.);const vec4 D=vec4(0.,.5,1.,2.);
vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.-g;
vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;
i=mod289(i);vec4 p=permute(permute(permute(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
float n_=.142857142857;vec3 ns=n_*D.wyz-D.xzx;vec4 j=p-49.*floor(p*ns.z*ns.z);vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.*x_);
vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;vec4 h=1.-abs(x)-abs(y);vec4 b0=vec4(x.xy,y.xy);vec4 b1=vec4(x.zw,y.zw);
vec4 s0=floor(b0)*2.+1.;vec4 s1=floor(b1)*2.+1.;vec4 sh=-step(h,vec4(0.));vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);
vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);m=m*m;
return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));}`;

// ---------------- the core: a living, audio-deformed energy sphere ----------------
const coreUniforms = { uTime: { value: 0 }, uLevel: { value: 0 }, uBass: { value: 0 }, uColor: { value: color } };
const coreMat = new THREE.ShaderMaterial({
  uniforms: coreUniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `${NOISE}
    uniform float uTime, uLevel, uBass; varying float vF; varying float vD;
    void main(){
      float n = snoise(normal * 1.6 + uTime * .35) * (.06 + uLevel * .55) + snoise(normal * 4.0 - uTime * .6) * (.02 + uLevel * .18);
      vec3 p = position * (1. + uBass * .18) + normal * n; vD = n;
      vec4 mv = modelViewMatrix * vec4(p, 1.);
      vF = pow(1. - abs(dot(normalize(normalMatrix * normal), normalize(-mv.xyz))), 2.2);
      gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform vec3 uColor; uniform float uLevel; varying float vF; varying float vD;
    void main(){ vec3 c = mix(uColor * .25, mix(uColor, vec3(1.), .35 + vD * 2.), vF);
      gl_FragColor = vec4(c, .05 + vF * .75 + uLevel * .12); }`,
});
const core = new THREE.Mesh(new THREE.IcosahedronGeometry(1.15, 64), coreMat);
scene.add(core);

// wireframe shell that follows the same deformation
const wireMat = coreMat.clone(); wireMat.wireframe = true; wireMat.uniforms = coreUniforms;
const shell = new THREE.Mesh(new THREE.IcosahedronGeometry(1.32, 6), wireMat);
shell.material.opacity = .4; scene.add(shell);

// blazing inner heart (sprite)
function glowTexture(stops) {
  const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d");
  const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128); stops.forEach(([o, col]) => gr.addColorStop(o, col));
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256); return new THREE.CanvasTexture(c);
}
const heartTex = glowTexture([[0, "rgba(255,255,255,1)"], [.12, "rgba(200,250,255,.8)"], [.35, "rgba(0,200,255,.15)"], [1, "rgba(0,0,0,0)"]]);
const heart = new THREE.Sprite(new THREE.SpriteMaterial({ map: heartTex, blending: THREE.AdditiveBlending, depthWrite: false, color }));
heart.scale.setScalar(2.2); scene.add(heart);

// ---------------- 3D spectrum: bars radiating from the core into space ----------------
const BARS = 160;
const barGeo = new THREE.BoxGeometry(0.028, 1, 0.028); barGeo.translate(0, 0.5, 0);
const barMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .75, blending: THREE.AdditiveBlending, depthWrite: false });
function barRing(radius, tilt) {
  const m = new THREE.InstancedMesh(barGeo, barMat.clone(), BARS);
  m.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(BARS * 3), 3);
  m.userData = { radius, lv: new Float32Array(BARS) }; m.rotation.x = tilt; scene.add(m); return m;
}
const ringA = barRing(1.85, 0);          // faces the camera
const ringB = barRing(2.35, Math.PI / 2.3); // tilted disc for depth
const dummy = new THREE.Object3D(), tmpC = new THREE.Color();

// ---------------- orbiting rings & dotted orbits ----------------
const orbits = [];
for (const [r, tx, tz, spd, th] of [[2.9, 1.2, .2, .15, .006], [3.4, -.5, .9, -.1, .004], [2.6, .3, -1.1, .22, .005], [4.2, 1.45, .05, .05, .003]]) {
  const t = new THREE.Mesh(new THREE.TorusGeometry(r, th, 8, 256, Math.PI * (1.2 + Math.random() * .7)),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .55, blending: THREE.AdditiveBlending }));
  t.rotation.set(tx, 0, tz); t.userData.spd = spd; scene.add(t); orbits.push(t);
}
const dotTex = glowTexture([[0, "rgba(255,255,255,1)"], [.3, "rgba(255,255,255,.6)"], [1, "rgba(0,0,0,0)"]]);
function dottedRing(r, n, size, tilt) {
  const pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; pos.set([Math.cos(a) * r, Math.sin(a) * r, 0], i * 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({ size, map: dotTex, color, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  p.rotation.x = tilt; scene.add(p); return p;
}
const dotsA = dottedRing(1.62, 120, .05, 0), dotsB = dottedRing(3.05, 240, .045, Math.PI / 2.3);

// ---------------- particle galaxy (the "no boundaries" part) ----------------
const P = 9000, gpos = new Float32Array(P * 3), gseed = new Float32Array(P);
for (let i = 0; i < P; i++) {
  const arm = i % 3, r = 2.2 + Math.pow(Math.random(), 1.6) * 16, a = arm / 3 * Math.PI * 2 + r * .42 + (Math.random() - .5) * .6;
  gpos.set([Math.cos(a) * r, (Math.random() - .5) * (0.25 + r * .05), Math.sin(a) * r], i * 3); gseed[i] = Math.random();
}
const galaxyGeo = new THREE.BufferGeometry();
galaxyGeo.setAttribute("position", new THREE.BufferAttribute(gpos, 3));
galaxyGeo.setAttribute("seed", new THREE.BufferAttribute(gseed, 1));
const galaxyMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uBass: { value: 0 }, uColor: { value: color }, uTex: { value: dotTex } },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `attribute float seed; uniform float uTime, uBass; varying float vA;
    void main(){ vec4 mv = modelViewMatrix * vec4(position * (1. + uBass * .06 * seed), 1.);
      vA = .35 + .65 * fract(seed * 7.3 + uTime * .15 * seed);
      gl_PointSize = (10. + 16. * seed + uBass * 14.) / -mv.z; gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform vec3 uColor; uniform sampler2D uTex; varying float vA;
    void main(){ gl_FragColor = vec4(mix(uColor, vec3(1.), .25), 1.) * texture2D(uTex, gl_PointCoord) * vA * 1.1; }`,
});
const galaxy = new THREE.Points(galaxyGeo, galaxyMat);
galaxy.rotation.x = .38; scene.add(galaxy);

// distant star dust all around
const S = 2500, spos = new Float32Array(S * 3);
for (let i = 0; i < S; i++) { const v = new THREE.Vector3().randomDirection().multiplyScalar(25 + Math.random() * 60); spos.set([v.x, v.y, v.z], i * 3); }
const starGeo = new THREE.BufferGeometry(); starGeo.setAttribute("position", new THREE.BufferAttribute(spos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ size: .18, map: dotTex, color: 0x7fdfff, transparent: true, opacity: .6, depthWrite: false, blending: THREE.AdditiveBlending })));

// holographic floor grid
const grid = new THREE.GridHelper(80, 80, 0x00e5ff, 0x00e5ff);
grid.material.transparent = true; grid.material.opacity = .07; grid.position.y = -3.2; scene.add(grid);

// ---------------- beats: shockwaves + sparks ----------------
const shocks = [];
const shockGeo = new THREE.RingGeometry(0.98, 1, 128);
function shock(strength) {
  const m = new THREE.Mesh(shockGeo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .7 * strength, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
  m.scale.setScalar(1.8); m.rotation.x = Math.random() < .5 ? 0 : Math.PI / 2.3; scene.add(m); shocks.push(m);
}
const SP = 600, spkPos = new Float32Array(SP * 3), spkVel = new Float32Array(SP * 3), spkLife = new Float32Array(SP);
const spkGeo = new THREE.BufferGeometry(); spkGeo.setAttribute("position", new THREE.BufferAttribute(spkPos, 3));
const sparks = new THREE.Points(spkGeo, new THREE.PointsMaterial({ size: .09, map: dotTex, color, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
scene.add(sparks); let spkNext = 0;
function burst(n, speed) {
  for (let k = 0; k < n; k++) {
    const i = spkNext++ % SP, d = new THREE.Vector3().randomDirection();
    spkPos.set([d.x * 1.3, d.y * 1.3, d.z * 1.3], i * 3); spkVel.set([d.x * speed, d.y * speed, d.z * speed], i * 3); spkLife[i] = 1;
  }
}

// ---------------- audio: mic + voice demo ----------------
let actx, analyser, freq = new Uint8Array(512), micSrc, demoPlaying = false;
async function initAudio() {
  if (actx) return; actx = new AudioContext();
  analyser = actx.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = .72;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    micSrc = actx.createMediaStreamSource(stream); micSrc.connect(analyser);
  } catch {}
}
initAudio(); addEventListener("pointerdown", () => actx && actx.resume(), { once: true });

document.getElementById("demo").onclick = async () => {
  await initAudio(); await actx.resume(); if (demoPlaying) return;
  setState("thinking");
  try {
    const r = await fetch("/say", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: "Good day, Dev. This is my three dimensional core. Every ring, bar and particle you see is responding to my voice in real time. Shall we keep it?" }) });
    const { id } = await r.json();
    const buf = await actx.decodeAudioData(await (await fetch("/audio/" + id)).arrayBuffer());
    const src = actx.createBufferSource(); src.buffer = buf;
    const out = actx.createAnalyser(); out.fftSize = 1024; out.smoothingTimeConstant = .7;
    src.connect(out); out.connect(actx.destination);
    const micA = analyser; analyser = out; demoPlaying = true; setState("speaking");
    src.onended = () => { analyser = micA; demoPlaying = false; setState("idle"); };
    src.start();
  } catch { setState("idle"); }
};

// ---------------- states ----------------
function setState(s) {
  stateName = s; document.getElementById("state").textContent = STATES[s].label;
  document.getElementById("state").style.color = "#" + STATES[s].c.getHexString();
  document.querySelectorAll("[data-s]").forEach(b => b.classList.toggle("on", b.dataset.s === s));
}
document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => setState(b.dataset.s));

// ---------------- camera control (drag to orbit, gentle drift) ----------------
let yaw = 0, pitch = .07, dragging = false, lx = 0, ly = 0, idleYaw = 0;
addEventListener("pointerdown", e => { dragging = true; lx = e.clientX; ly = e.clientY; });
addEventListener("pointerup", () => dragging = false);
addEventListener("pointermove", e => { if (!dragging) return; yaw -= (e.clientX - lx) * .005; pitch = Math.max(-.6, Math.min(.8, pitch + (e.clientY - ly) * .004)); lx = e.clientX; ly = e.clientY; });

// ---------------- animation loop ----------------
const clock = new THREE.Clock(); let avgE = 0, lastShock = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  color.lerp(STATES[stateName].c, .06);

  // audio analysis
  let energy = 0, bass = 0, vals = new Float32Array(BARS);
  if (analyser) { if (freq.length !== analyser.frequencyBinCount) freq = new Uint8Array(analyser.frequencyBinCount); analyser.getByteFrequencyData(freq); }
  const gain = stateName === "speaking" || stateName === "listening" || demoPlaying ? 1.15 : .6;
  const half = BARS / 2;
  for (let i = 0; i < BARS; i++) {
    const k = i < half ? i : BARS - 1 - i, bin = Math.floor(1 + Math.pow(k / half, 1.7) * freq.length * .5);
    let v = analyser ? Math.pow(freq[bin] / 255, 1.3) * gain : 0;
    const synthetic = stateName === "thinking" ? .25 * Math.max(0, Math.sin(t * 5 - i * .15)) : 0;
    vals[i] = Math.max(v, .04 + .03 * Math.sin(t * 1.6 + i * .3) + synthetic);
    energy += vals[i]; if (k < 10) bass += vals[i];
  }
  energy /= BARS; bass /= 20;

  // bars
  for (const [ring, lag] of [[ringA, .55], [ringB, .3]]) {
    const lv = ring.userData.lv, R = ring.userData.radius;
    for (let i = 0; i < BARS; i++) {
      lv[i] += (vals[i] - lv[i]) * (vals[i] > lv[i] ? lag : .12);
      const a = i / BARS * Math.PI * 2, len = .04 + lv[i] * (ring === ringA ? 2.4 : 1.5);
      dummy.position.set(Math.cos(a) * R, Math.sin(a) * R, 0); dummy.rotation.set(0, 0, a - Math.PI / 2); dummy.scale.set(1, len, 1);
      dummy.updateMatrix(); ring.setMatrixAt(i, dummy.matrix);
      tmpC.copy(color).lerp(new THREE.Color(1, 1, 1), Math.min(.6, lv[i] * .45)); ring.setColorAt(i, tmpC);
    }
    ring.instanceMatrix.needsUpdate = true; ring.instanceColor.needsUpdate = true;
    ring.rotation.z += dt * (ring === ringA ? .05 : -.08) * (1 + energy * 3);
  }

  // core + heart
  coreUniforms.uTime.value = t; coreUniforms.uLevel.value += (energy * 1.6 - coreUniforms.uLevel.value) * .2;
  coreUniforms.uBass.value += (bass - coreUniforms.uBass.value) * .25;
  core.rotation.y += dt * .15; shell.rotation.y -= dt * .1; shell.rotation.x += dt * .05;
  heart.scale.setScalar(1.15 + energy * 1.8 + Math.sin(t * 2) * .05); heart.material.color = color;

  // orbits, dots, galaxy
  const spin = stateName === "thinking" ? 5 : 1 + energy * 4;
  orbits.forEach(o => { o.rotation.z += o.userData.spd * dt * spin; o.material.color = color; o.material.opacity = .35 + energy * .8; });
  dotsA.rotation.z -= dt * .2 * spin; dotsB.rotation.z += dt * .12 * spin; dotsA.material.color = dotsB.material.color = color;
  galaxy.rotation.y += dt * (.03 + energy * .15); galaxyMat.uniforms.uTime.value = t; galaxyMat.uniforms.uBass.value = bass;
  sparks.material.color = color;

  // beats
  if (energy > avgE * 1.35 && energy > .13 && t - lastShock > .18) { shock(Math.min(1, energy * 2)); burst(30 + energy * 120, 2 + energy * 6); lastShock = t; }
  avgE += (energy - avgE) * .05;
  for (let i = shocks.length - 1; i >= 0; i--) {
    const s = shocks[i]; s.scale.multiplyScalar(1 + dt * 1.6); s.material.opacity -= dt * .9;
    if (s.material.opacity <= 0) { scene.remove(s); s.material.dispose(); shocks.splice(i, 1); }
  }
  for (let i = 0; i < SP; i++) {
    if (spkLife[i] <= 0) { spkPos[i * 3 + 1] = 9999; continue; }
    spkLife[i] -= dt * .8; for (let k = 0; k < 3; k++) { spkPos[i * 3 + k] += spkVel[i * 3 + k] * dt; spkVel[i * 3 + k] *= .97; }
  }
  spkGeo.attributes.position.needsUpdate = true;

  // camera
  if (!dragging) idleYaw += dt * .04;
  const cy = yaw + Math.sin(idleYaw) * .35, dist = 8.2 - energy * .8;
  camera.position.set(Math.sin(cy) * dist * Math.cos(pitch), .6 + Math.sin(pitch) * dist, Math.cos(cy) * dist * Math.cos(pitch));
  camera.lookAt(0, 0, 0);
  bloom.strength = 0.7 + energy * 0.9;

  composer.render();
  requestAnimationFrame(frame);
}
frame();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
